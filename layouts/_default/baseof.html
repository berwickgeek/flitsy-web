<!doctype html>
<html lang="{{ site.LanguageCode | default "en" }}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
{{- $title := cond .IsHome (printf "%s — A CRM that lives inside your AI" site.Title) (printf "%s — %s" .Title site.Title) }}
<title>{{ $title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />
<meta property="og:title" content="{{ $title }}" />
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />
<meta name="theme-color" content="{{ site.Params.themeColor }}" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body{{ if not .IsHome }} class="doc"{{ end }}>

<div class="nav-wrap" id="navwrap">
  <nav class="top">
    <a class="logo" href="{{ "/" | relURL }}">
      <span class="logo-mark">f</span>
      <span>flitsy<span class="dot">.</span>app</span>
    </a>
    <div class="nav-links">
      <a href="{{ "/" | relURL }}#how">How it works</a>
      <a href="{{ "/what-you-can-ask/" | relURL }}">Capabilities</a>
      <a href="{{ "/pricing/" | relURL }}" class="nav-cta-link">Pricing</a>
      <a href="{{ "/" | relURL }}#faq">FAQ</a>
    </div>
  </nav>
</div>

{{ block "main" . }}{{ end }}

<footer>
  <div class="left">
    <span>© flitsy.app</span>
  </div>
  <div class="right">
    <a href="{{ "/" | relURL }}#how">How it works</a>
    <a href="{{ "/" | relURL }}#why">Why MCP</a>
    <a href="{{ "/what-you-can-ask/" | relURL }}">Capabilities</a>
    <a href="{{ "/pricing/" | relURL }}">Pricing</a>
    <a href="{{ "/" | relURL }}#faq">FAQ</a>
    <a href="{{ "/privacy/" | relURL }}">Privacy</a>
    <a href="{{ "/terms/" | relURL }}">Terms</a>
  </div>
</footer>

<script src="{{ "js/app.js" | relURL }}"></script>
</body>
</html>
